[llm]
endpoint = "https://api.openai.com/v1"
# Set your API key here, or use the MIMIR_LLM_API_KEY environment variable.
api_key = ""
model = "gpt-4o"
temperature = 0.2
# max_tokens = 4096  # Optional: limit tokens per generation

[agent]
name = "Mimir"
proactivity = "important_only"
verbose_reasoning = false
max_tool_rounds = 100  # Maximum agentic tool-call rounds
remember_debounce_seconds = 10  # Debounce window for the remember.chat hook

[memory]
enabled = true
char_limit = 2500
auto_manage = true
temporal_horizon = 30
condensation_top_n = 500

[context]
max_turns = 20
db_path = "~/.local/share/mimir/context.db"
# max_tokens = 4096  # Optional: token budget for conversation history

[geocoder]
enabled = true
# Point at a self-hosted Nominatim instance for heavy use,
# e.g. https://nominatim.example.com
endpoint = "https://nominatim.openstreetmap.org"
# contact_email = "you@example.com"  # Optional: appended to the User-Agent (Nominatim policy)

[personality]
preset = "transparent"

[scheduler]
debounce_seconds = 5
cooldown_seconds = 60

[server]
bind_addr = "127.0.0.1:8080"
# socket_path = "~/.local/share/mimir/mimir.sock"  # Optional: Unix domain socket for local CLI
