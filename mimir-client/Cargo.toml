[package]
name = "mimir-client"
version.workspace = true
authors.workspace = true
license.workspace = true
description = "HTTP client library for talking to the Mimir daemon"
repository.workspace = true
homepage.workspace = true
edition.workspace = true
rust-version.workspace = true

[dependencies]
mimir-api-types = { path = "../mimir-api-types" }
reqwest = { version = "0.13", default-features = false, features = ["json", "stream", "rustls", "rustls-native-certs"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
futures = "0.3"
thiserror = "2.0"
bytes = "1.9"
tracing = "0.1"

[dev-dependencies]
wiremock = "0.6.5"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
