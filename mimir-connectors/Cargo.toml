[package]
name = "mimir-connectors"
version.workspace = true
authors.workspace = true
license.workspace = true
description = "Connector framework for Mimir: service ingestion workers that normalize external data into knowledge-graph facts"
repository.workspace = true
homepage.workspace = true
edition.workspace = true
rust-version.workspace = true

# Per Phase 3 design decision A, this crate depends on mimir-core and
# mimir-knowledge only and never declares a direct `sqlx` dependency: all
# persistence is mediated by the `KnowledgeGraph` facade. The infra crates
# below are added by F6 (trait + data types); the gated backend dependencies
# (kamadak-exif, icalendar, async-imap, …) land with C1–C7 / F10.
[dependencies]
mimir-core = { path = "../mimir-core" }
mimir-knowledge = { path = "../mimir-knowledge" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2.0"
async-trait = "0.1"
# F8 (issue #185): the ConnectorSupervisor drives supervised tokio tasks with
# exponential backoff and observes a watch-channel shutdown signal. `rt`,
# `sync` (watch/mutex), `time` (backoff sleeps), and `macros` (select!) are
# required; `rt-multi-thread` is added by the dev-dependency for tests.
tokio = { version = "1", features = ["rt", "sync", "time", "macros", "net", "io-util"] }
tracing = "0.1"

# F12 (issue #189): shared rate-limit + retry/backoff primitives. `governor`
# provides a vetted, safe (no `unsafe`) GCRA token-bucket limiter with built-in
# jitter and async `until_ready`; `rand` (pinned to the 0.9 line governor
# already pulls in transitively, so no extra major version enters the tree)
# provides jitter entropy for the retry/backoff layer. Governor's async sleeps
# use its own clock (`futures-timer`), so no `tokio` feature flag is required.
governor = "0.10"
rand = "0.9"
# `humantime` gives human-readable Duration serde (e.g. "500ms", "30s") for the
# rate-limit config, so per-connector `config_json` stays editable by hand.
humantime = "2.4"
# S1 (issue #191): the OSM Nominatim geocoder backend issues outbound HTTPS
# requests via `reqwest`. rustls (no OpenSSL system dep) keeps this crate
# consistent with `mimir-core`/`mimir-server`; `json` deserialises Nominatim
# responses. The backend builds `/search` and `/reverse` query strings by hand
# (see `percent_encode_query` in `src/geocoder.rs`), so the `query` feature is
# not required. `mimir-core` re-exports the `Geocoder` trait the backend
# implements.
reqwest = { version = "0.13", default-features = false, features = ["json", "form", "rustls", "rustls-native-certs"] }
# `percent-encoding` percent-encodes the `/search` query value. It is already a
# transitive dependency (via `reqwest`/`url`, resolved at 2.3.2) so this adds no
# new download; declared directly so the geocoder does not rely on transitive
# availability. Replaces a hand-rolled encoder (PR #221 review).
percent-encoding = "2.3"
# C1 (issue #195): Photos local-filesystem connector. `notify` (8.2.0, the
# latest stable on the 8.x line; 9.x is pre-release) provides the cross-platform
# `RecommendedWatcher` filesystem watcher. Debouncing lives in the separate
# `notify-debouncer-full` crate (0.7.0, depends on `notify ^8.2.0`); it carries
# the `FileIdMap`/`RecommendedCache` that coalesces noisy rename/modify bursts.
# Neither crate ships a tokio feature in its 0.7/8.2 stable line, so the photos
# module implements `DebounceEventHandler` on a newtype wrapping a
# `tokio::sync::mpsc::UnboundedSender` (a synchronous `send`) — no forwarder
# thread and no extra async runtime dep. `kamadak-exif` (0.6.1) is a pure-Rust
# EXIF reader covering JPEG/TIFF/HEIF/PNG/WebP containers ("across camera
# formats"). All three are optional, gated by the `photos` feature.
notify = { version = "8.2", optional = true }
notify-debouncer-full = { version = "0.7", optional = true }
kamadak-exif = { version = "0.6", optional = true }

# C3 (issue #197): CalDAV calendar connector. `icalendar` (0.17.x; latest
# 0.17.12) is the strongly-typed RFC 5545 parser/builder used to parse CalDAV
# VEVENT payloads. Its default features already include `parser` (nom-backed),
# so no extra feature flag is required for parsing. License MIT/Apache-2.0
# (GPL-3-compatible). Gated by the `calendar` feature. The `oauth2` crate is
# deliberately NOT pulled in here: oauth2 5.0.0 depends on reqwest 0.12, which
# would duplicate the workspace's reqwest 0.13 HTTP/TLS stack. #197 only needs
# OAuth *token refresh* (the interactive PKCE login is A4 / #206), and a refresh
# is a single form-encoded HTTPS POST returning JSON — hand-rolled on the
# existing reqwest 0.13 (see `CalendarConnector::refresh_oauth`). The `oauth2`
# crate is deferred to A4, where the PKCE authorization-code flow justifies it;
# see the follow-up issue tracking the deps-ledger / reqwest-0.13 reconciliation.
icalendar = { version = "0.17", optional = true }
# `roxmltree` is a small, pure-Rust, read-only DOM XML parser used to walk
# CalDAV WebDAV multistatus responses (sync-collection REPORT + PROPFIND).
# A DOM parser is far simpler + more robust than a hand-rolled pull-parser for
# the nested `response`/`propstat`/`prop` structure, and matches element local
# names so the varied namespace prefixes servers use (`D:`/`d:`/`cal:`/`C:`)
# are tolerated. License MIT/Apache-2.0 (GPL-3-compatible). Gated by `calendar`.
# No new download vs quick-xml-style alternatives; roxmltree pulls only `memchr`.
roxmltree = { version = "0.21", optional = true }

# C5 (issue #199): IMAP email connector. `async-imap` (0.11.3, latest stable;
# the issue spec's 0.11.2 is one patch behind) provides the async IMAP client
# (Session, uid_fetch, idle). `default-features = false` + `runtime-tokio`
# avoids pulling `async-std` into the tokio-only workspace (the default feature
# is `runtime-async-std`). async-imap ships no TLS; we supply a rustls TLS
# stream to `Client::new` (see below) instead of its `connect()` helper
# (async-native-tls / OpenSSL), keeping the workspace on a single rustls TLS
# stack. Gated by the `gmail` feature.
async-imap = { version = "0.11.3", default-features = false, features = ["runtime-tokio"], optional = true }
# `base64` builds the XOAUTH2 SASL initial client response
# (`base64("user=<u>\x01auth=Bearer <t>\x01\x01")`). Already in the tree at
# 0.22.1 (async-imap's own dep), so this adds no new download. Gated by `gmail`.
base64 = { version = "0.22", optional = true }
# Raw IMAP runs over implicit-TLS (imaps:993). We hand-roll the TCP+rustls
# handshake rather than use async-imap's `connect()` (which pulls
# async-native-tls) to keep a single rustls TLS stack. `tokio-rustls` (0.26,
# already in the tree via reqwest) wraps the tokio TCP stream; `rustls` (0.23)
# builds the `ClientConfig`; `rustls-native-certs` (0.8) loads the system trust
# store, matching reqwest's `rustls-native-certs` feature. The `aws-lc-rs`
# crypto provider matches the one reqwest's `rustls` feature already compiles,
# so no second crypto provider enters the tree. All gated by `gmail`.
tokio-rustls = { version = "0.26", optional = true }
rustls = { version = "0.23", default-features = false, features = ["std", "aws-lc-rs", "tls12"], optional = true }
rustls-native-certs = { version = "0.8", optional = true }
# `futures` streams the `uid_fetch` response (async-imap returns an impl
# `Stream`). Already in the tree at 0.3.x, so no new download. Gated by `gmail`.
futures = { version = "0.3", optional = true }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
tempfile = "3"
wiremock = "0.6"

[features]
default = ["photos", "calendar", "gmail"]
## Google Photos / Apple Photos / local photo library ingestion (C1–C2).
photos = ["dep:notify", "dep:notify-debouncer-full", "dep:kamadak-exif"]
## CalDAV calendar ingestion: read/sync + event fact extraction (C3–C4).
calendar = ["dep:icalendar", "dep:roxmltree"]
## IMAP email ingestion, Gmail and other providers (C5–C7).
gmail = ["dep:async-imap", "dep:base64", "dep:tokio-rustls", "dep:rustls", "dep:rustls-native-certs", "dep:futures"]
