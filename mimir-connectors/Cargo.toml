[package]
name = "mimir-connectors"
version.workspace = true
authors.workspace = true
license.workspace = true
description = "Connector framework for Mimir: service ingestion workers that normalize external data into knowledge-graph facts"
repository.workspace = true
homepage.workspace = true
edition.workspace = true
rust-version.workspace = true

# Per Phase 3 design decision A, this crate depends on mimir-core and
# mimir-knowledge only and never declares a direct `sqlx` dependency: all
# persistence is mediated by the `KnowledgeGraph` facade. The infra crates
# below are added by F6 (trait + data types); the gated backend dependencies
# (kamadak-exif, icalendar, async-imap, …) land with C1–C7 / F10.
[dependencies]
mimir-core = { path = "../mimir-core" }
mimir-knowledge = { path = "../mimir-knowledge" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2.0"
async-trait = "0.1"
# F8 (issue #185): the ConnectorSupervisor drives supervised tokio tasks with
# exponential backoff and observes a watch-channel shutdown signal. `rt`,
# `sync` (watch/mutex), `time` (backoff sleeps), and `macros` (select!) are
# required; `rt-multi-thread` is added by the dev-dependency for tests.
tokio = { version = "1", features = ["rt", "sync", "time", "macros"] }
tracing = "0.1"

# F12 (issue #189): shared rate-limit + retry/backoff primitives. `governor`
# provides a vetted, safe (no `unsafe`) GCRA token-bucket limiter with built-in
# jitter and async `until_ready`; `rand` (pinned to the 0.9 line governor
# already pulls in transitively, so no extra major version enters the tree)
# provides jitter entropy for the retry/backoff layer. Governor's async sleeps
# use its own clock (`futures-timer`), so no `tokio` feature flag is required.
governor = "0.10"
rand = "0.9"
# `humantime` gives human-readable Duration serde (e.g. "500ms", "30s") for the
# rate-limit config, so per-connector `config_json` stays editable by hand.
humantime = "2.4"
# S1 (issue #191): the OSM Nominatim geocoder backend issues outbound HTTPS
# requests via `reqwest`. rustls (no OpenSSL system dep) keeps this crate
# consistent with `mimir-core`/`mimir-server`; `json` deserialises Nominatim
# responses, and `query` builds the `/search` and `/reverse` query strings.
# `mimir-core` re-exports the `Geocoder` trait the backend implements.
# S1 (issue #191): the OSM Nominatim geocoder backend issues outbound HTTPS
# requests via `reqwest`. rustls (no OpenSSL system dep) keeps this crate
# consistent with `mimir-core`/`mimir-server`; `json` deserialises Nominatim
# responses, and `query` builds the `/search` and `/reverse` query strings.
# `mimir-core` re-exports the `Geocoder` trait the backend implements.
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls", "rustls-native-certs", "query"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
tempfile = "3"
wiremock = "0.6"

[features]
default = ["photos", "calendar", "gmail"]
## Google Photos / Apple Photos / local photo library ingestion (C1–C2).
photos = []
## CalDAV calendar ingestion: read/sync + event fact extraction (C3–C4).
calendar = []
## IMAP email ingestion, Gmail and other providers (C5–C7).
gmail = []
