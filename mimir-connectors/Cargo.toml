[package]
name = "mimir-connectors"
version.workspace = true
authors.workspace = true
license.workspace = true
description = "Connector framework for Mimir: service ingestion workers that normalize external data into knowledge-graph facts"
repository.workspace = true
homepage.workspace = true
edition.workspace = true
rust-version.workspace = true

# Per Phase 3 design decision A, this crate depends on mimir-core and
# mimir-knowledge only and never declares a direct `sqlx` dependency: all
# persistence is mediated by the `KnowledgeGraph` facade. The infra crates
# below are added by F6 (trait + data types); the gated backend dependencies
# (kamadak-exif, icalendar, async-imap, …) land with C1–C7 / F10.
[dependencies]
mimir-core = { path = "../mimir-core" }
mimir-knowledge = { path = "../mimir-knowledge" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
# `wiremock` backs the shared token-endpoint mock in `test_utils`
# (`mount_token_endpoint`, issue #298). Optional so production builds never
# compile it; the crate's own unit tests still get it from `[dev-dependencies]`
# when the `test-utils` feature is off.
wiremock = { version = "0.6", optional = true }
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2.0"
async-trait = "0.1"
# F8 (issue #185): the ConnectorSupervisor drives supervised tokio tasks with
# exponential backoff and observes a watch-channel shutdown signal. `rt`,
# `sync` (watch/mutex), `time` (backoff sleeps), and `macros` (select!) are
# required; `rt-multi-thread` is added by the dev-dependency for tests.
tokio = { version = "1", features = ["rt", "sync", "time", "macros", "net", "io-util"] }
tracing = "0.1"

# F12 (issue #189): shared rate-limit + retry/backoff primitives. `governor`
# provides a vetted, safe (no `unsafe`) GCRA token-bucket limiter with built-in
# jitter and async `until_ready`; `rand` (pinned to the 0.9 line governor
# already pulls in transitively, so no extra major version enters the tree)
# provides jitter entropy for the retry/backoff layer. Governor's async sleeps
# use its own clock (`futures-timer`), so no `tokio` feature flag is required.
governor = "0.10"
rand = "0.9"
# `humantime` gives human-readable Duration serde (e.g. "500ms", "30s") for the
# rate-limit config, so per-connector `config_json` stays editable by hand.
humantime = "2.4"
# S1 (issue #191): the OSM Nominatim geocoder backend issues outbound HTTPS
# requests via `reqwest`. rustls (no OpenSSL system dep) keeps this crate
# consistent with `mimir-core`/`mimir-server`; `json` deserialises Nominatim
# responses. The backend builds `/search` and `/reverse` query strings by hand
# (see `percent_encode_query` in `src/geocoder.rs`), so the `query` feature is
# not required. `form` was dropped in #240: the OAuth refresh POST is now
# built by the `oauth2` crate itself (which constructs the form-encoded body
# as bytes), so reqwest's `form` feature is unused. `mimir-core` re-exports
# the `Geocoder` trait the backend implements.
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls", "rustls-native-certs"] }
# `http` 1.x request/response types for the `oauth2` adapter (`OAuthHttpClient`
# converts `http::Request<Vec<u8>>` ↔ reqwest and back). Already in the tree
# (reqwest and oauth2 both depend on http 1.x), so no new download; declared
# directly so the adapter does not rely on a transitive re-export.
http = { version = "1", optional = true }
# `url` parses the loopback callback request target and decodes its query
# pairs (A4 / #205 PKCE flow). Already in the tree at 2.5.8 (oauth2's own
# dependency), so no new download; declared directly so the PKCE module does
# not rely on a transitive re-export. Gated by the `oauth` feature.
url = { version = "2", optional = true }
# `percent-encoding` percent-encodes the `/search` query value. It is already a
# transitive dependency (via `reqwest`/`url`, resolved at 2.3.2) so this adds no
# new download; declared directly so the geocoder does not rely on transitive
# availability. Replaces a hand-rolled encoder (PR #221 review).
percent-encoding = "2.3"
# C1 (issue #195): Photos local-filesystem connector. `notify` (8.2.0, the
# latest stable on the 8.x line; 9.x is pre-release) provides the cross-platform
# `RecommendedWatcher` filesystem watcher. Debouncing lives in the separate
# `notify-debouncer-full` crate (0.7.0, depends on `notify ^8.2.0`); it carries
# the `FileIdMap`/`RecommendedCache` that coalesces noisy rename/modify bursts.
# Neither crate ships a tokio feature in its 0.7/8.2 stable line, so the photos
# module implements `DebounceEventHandler` on a newtype wrapping a
# `tokio::sync::mpsc::UnboundedSender` (a synchronous `send`) — no forwarder
# thread and no extra async runtime dep. `kamadak-exif` (0.6.1) is a pure-Rust
# EXIF reader covering JPEG/TIFF/HEIF/PNG/WebP containers ("across camera
# formats"). All three are optional, gated by the `photos` feature.
notify = { version = "8.2", optional = true }
notify-debouncer-full = { version = "0.7", optional = true }
kamadak-exif = { version = "0.6", optional = true }

# C3 (issue #197): CalDAV calendar connector. `icalendar` (0.17.x; resolves to
# 0.17.6 under the workspace MSRV 1.85 — 0.17.7+ requires Rust 1.88; see issue
# #239) is the strongly-typed RFC 5545 parser/builder used to parse CalDAV
# VEVENT payloads. Its default features already include `parser` (nom-backed),
# so no extra feature flag is required for parsing. License MIT/Apache-2.0
# (GPL-3-compatible). Gated by the `calendar` feature.
icalendar = { version = "0.17", optional = true }
# OAuth 2.0 (issue #240): the vetted `oauth2` 5.0.0 protocol implementation
# (PKCE S256, authorization-code + refresh grants) with `default-features =
# false` — its default `reqwest` feature pins reqwest 0.12, which would
# duplicate the workspace's reqwest 0.13 HTTP/TLS stack. Instead `src/oauth/`
# implements the crate's `AsyncHttpClient` trait over the workspace reqwest
# 0.13 client (`OAuthHttpClient`). oauth2 5.0.0's unconditional deps are
# already in the tree (sha2 0.10, base64, serde_path_to_error, thiserror 1.x,
# http 1.x, url) except `rand 0.8` — a third rand line (workspace already has
# 0.9 via governor and 0.10 transitively); it is small, ubiquitous, and
# required by oauth2's PKCE verifier generation. License MIT/Apache-2.0
# (GPL-3-compatible). Gated by the `oauth` feature.
oauth2 = { version = "5.0", default-features = false, optional = true }
# T2 (issue #207): the in-process mock OAuth server generates a self-signed
# certificate at test runtime (`rcgen` 0.14.x, latest stable) and computes the
# PKCE S256 challenge check with `sha2` (0.10, already in the tree via
# `oauth2`). Both are gated by the `test-mock-oauth` feature (off by default).
rcgen = { version = "0.14", optional = true }
sha2 = { version = "0.10", optional = true }
# `roxmltree` is a small, pure-Rust, read-only DOM XML parser used to walk
# CalDAV WebDAV multistatus responses (sync-collection REPORT + PROPFIND).
# A DOM parser is far simpler + more robust than a hand-rolled pull-parser for
# the nested `response`/`propstat`/`prop` structure, and matches element local
# names so the varied namespace prefixes servers use (`D:`/`d:`/`cal:`/`C:`)
# are tolerated. License MIT/Apache-2.0 (GPL-3-compatible). Gated by `calendar`.
# No new download vs quick-xml-style alternatives; roxmltree pulls only `memchr`.
roxmltree = { version = "0.21", optional = true }
# C4 (issue #198): CalDAV event → KB fact extraction. `DTSTART`/`DTEND` may be
# `TZID`-qualified (`DTSTART;TZID=Europe/London:20250503T090000`); `icalendar`
# 0.17 stores the tzid but cannot convert it to UTC without its own
# `chrono-tz` feature (not exposed in this line), so the calendar module does
# the resolution itself. `chrono-tz` (0.10.4, latest; built on chrono 0.4 and
# the IANA tz database) parses an IANA zone name and converts a local naive
# datetime to UTC, DST-correct. License MIT/Apache-2.0 (GPL-3-compatible).
# Gated by the `calendar` feature.
chrono-tz = { version = "0.10", optional = true }
# C4 (issue #198): CalDAV write-back generates a stable `UID` for new events
# (the CalDAV item href is `<calendar>/<uid>.ics`, so the UID must be known
# before the PUT). `uuid` v1 is already in the tree (transitive via
# `icalendar`); the `v4` feature enables random generation with no new
# download. License MIT/Apache-2.0 (GPL-3-compatible). Gated by `calendar`.
uuid = { version = "1", features = ["v4"], optional = true }

# C5 (issue #199): IMAP email connector. `async-imap` (0.11.3, latest stable;
# the issue spec's 0.11.2 is one patch behind) provides the async IMAP client
# (Session, uid_fetch, idle). `default-features = false` + `runtime-tokio`
# avoids pulling `async-std` into the tokio-only workspace (the default feature
# is `runtime-async-std`). async-imap ships no TLS; we supply a rustls TLS
# stream to `Client::new` (see below) instead of its `connect()` helper
# (async-native-tls / OpenSSL), keeping the workspace on a single rustls TLS
# stack. Gated by the `gmail` feature.
async-imap = { version = "0.11.3", default-features = false, features = ["runtime-tokio"], optional = true }
# `base64` builds the XOAUTH2 SASL initial client response
# (`base64("user=<u>\x01auth=Bearer <t>\x01\x01")`). Already in the tree at
# 0.22.1 (async-imap's own dep), so this adds no new download. Gated by `gmail`.
base64 = { version = "0.22", optional = true }
# Raw IMAP runs over implicit-TLS (imaps:993). We hand-roll the TCP+rustls
# handshake rather than use async-imap's `connect()` (which pulls
# async-native-tls) to keep a single rustls TLS stack. `tokio-rustls` (0.26,
# already in the tree via reqwest) wraps the tokio TCP stream; `rustls` (0.23)
# builds the `ClientConfig`; `rustls-native-certs` (0.8) loads the system trust
# store, matching reqwest's `rustls-native-certs` feature. The `aws-lc-rs`
# crypto provider matches the one reqwest's `rustls` feature already compiles,
# so no second crypto provider enters the tree. All gated by `gmail`.
tokio-rustls = { version = "0.26", optional = true }
rustls = { version = "0.23", default-features = false, features = ["std", "aws-lc-rs", "tls12"], optional = true }
rustls-native-certs = { version = "0.8", optional = true }
# `futures` streams the `uid_fetch` response (async-imap returns an impl
# `Stream`). Already in the tree at 0.3.x, so no new download. Gated by `gmail`.
futures = { version = "0.3", optional = true }
# C6 (issue #200): email mail parsing. `mail-parser` (0.11.5, latest stable;
# the issue spec's 0.11.4 is one patch behind) is the RFC 5322 / MIME parser
# that turns the staged RFC 822 bytes into a structured `Message` (headers,
# addresses, MIME parts). It decodes charsets / transfer encodings and exposes
# the `text/calendar` iMIP parts this issue extracts. License MIT/Apache-2.0
# (GPL-3-compatible). Gated by the `gmail` feature.
mail-parser = { version = "0.11.5", optional = true }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
tempfile = "3"
wiremock = "0.6"
# `url` builds/parses the mock-OAuth-server request forms in the T2 E2E tests
# (issue #207). Already in the tree (oauth2's dependency), so no new download.
url = "2"
# Enable mimir-core's `mock-llm` feature for deterministic connector LLM tests
# (Email C7 / #201 prose-extraction layer).
mimir-core = { path = "../mimir-core", features = ["mock-llm"] }

[features]
default = ["photos", "calendar", "gmail"]
## Shared OAuth test doubles (issues #290, #298): the fake-browser
## `self_callback_opener` and `parse_authorize_url` helpers plus the
## `mount_token_endpoint` wiremock mock used by the PKCE flow unit tests and
## the `mimir` binary's CLI connector tests. Test-only, off by default; the
## crate's own unit tests compile the module via `cfg(test)` regardless.
## `wiremock` is optional so production builds never compile it.
test-utils = ["dep:wiremock"]
## Google Photos / Apple Photos / local photo library ingestion (C1–C2).
photos = ["dep:notify", "dep:notify-debouncer-full", "dep:kamadak-exif"]
## Shared OAuth 2.0 client + refresh helpers (issue #240): `oauth2` 5.0.0 with
## `default-features = false` + a custom `AsyncHttpClient` adapter over the
## workspace reqwest 0.13 client (see `src/oauth/`). Enabled by the OAuth
## backends (`calendar`, `gmail`) and by the CLI's PKCE login flow (A4 / #205).
oauth = ["dep:oauth2", "dep:http", "dep:url"]
## In-process mock OAuth 2.0 authorization server (Phase 3 T2 / #207): an
## HTTPS `/authorize` + HTTP `/token` loopback pair that the PKCE-flow E2E
## tests drive without a real provider. Test-only, off by default. Reuses the
## `oauth` feature (the flow under test) and the `tokio-rustls`/`rustls`/
## `base64` optional deps already gated by `gmail`.
test-mock-oauth = ["oauth", "dep:rcgen", "dep:sha2", "dep:tokio-rustls", "dep:rustls", "dep:base64"]
## CalDAV calendar ingestion: read/sync + event fact extraction (C3–C4).
calendar = ["dep:icalendar", "dep:roxmltree", "dep:chrono-tz", "dep:uuid", "oauth"]
## IMAP email ingestion, Gmail and other providers (C5–C7).
gmail = ["dep:async-imap", "dep:base64", "dep:tokio-rustls", "dep:rustls", "dep:rustls-native-certs", "dep:futures", "dep:icalendar", "dep:chrono-tz", "dep:mail-parser", "oauth"]
