[package]
name = "mimir-core"
version.workspace = true
authors.workspace = true
license.workspace = true
description = "Core library for Mimir: LLM client, config, context, tools, skills"
repository.workspace = true
homepage.workspace = true
edition.workspace = true
rust-version.workspace = true

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
anyhow = "1.0"
dirs = "6.0"
thiserror = "2.0"
tokio = { version = "1", features = ["rt-multi-thread", "time", "fs", "process", "macros", "sync", "net"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "stream", "rustls", "rustls-native-certs"] }
eventsource-stream = "0.2.3"
futures = "0.3"
bytes = "1.9"
tracing = "0.1"
serde_yaml = "0.9"
sqlx = { workspace = true }
chrono = { version = "0.4", features = ["serde"] }
async-trait = "0.1"
urlencoding = "2.1"
tokio-util = "0.7"
getrandom = "0.4"
subtle = "2.6"

[target.'cfg(target_os = "linux")'.dependencies]
nix = { version = "0.31", features = ["process", "sched"] }

[target.'cfg(unix)'.dependencies]
rustix = { version = "1.1", features = ["process"] }

[dev-dependencies]
tempfile = "3"
serial_test = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "fs", "process", "sync", "net"] }
dashmap = "6.2"
wiremock = "0.6.5"
criterion = { version = "0.8.2", features = ["async_tokio"] }
# Self-referential dev-dependency so integration tests and benches can use
# `MockLlmClient` (feature-gated `mock-llm`), mirroring how downstream crates
# opt in via dev-dependencies.
mimir-core = { path = ".", features = ["mock-llm"] }

[features]
mock-llm = []

[[bench]]
name = "context_manager"
harness = false
[[bench]]
name = "tool_registry"
harness = false

[[bench]]
name = "personality"
harness = false

[[bench]]
name = "pure_helpers"
harness = false

[[bench]]
name = "db_init"
harness = false

[[bench]]
name = "mock_llm"
harness = false
