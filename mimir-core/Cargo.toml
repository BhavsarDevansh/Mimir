[package]
name = "mimir-core"
version = "0.15.1"
edition = "2024"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
anyhow = "1.0"
dirs = "6.0"
thiserror = "2.0"
tokio = { version = "1", features = ["rt-multi-thread", "time", "fs", "process", "macros"] }
reqwest = { version = "0.13", features = ["json", "stream"] }
eventsource-stream = "0.2.3"
futures = "0.3"
bytes = "1.9"
tracing = "0.1"
serde_yaml = "0.9"
sqlx = { version = "0.9", features = ["runtime-tokio", "sqlite", "chrono", "uuid"] }
uuid = { version = "1.23", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
async-trait = "0.1"

[dev-dependencies]
tempfile = "3"
serial_test = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "fs", "process"] }
dashmap = "6.2"
wiremock = "0.6.5"
criterion = { version = "0.8.2", features = ["async_tokio"] }

[features]
mock-llm = []

[[bench]]
name = "context_manager"
harness = false

[[bench]]
name = "memory_manager"
harness = false

[[bench]]
name = "tool_registry"
harness = false

[[bench]]
name = "personality"
harness = false
