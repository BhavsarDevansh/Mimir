[package]
name = "mimir-core"
version = "0.1.0"
edition = "2024"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
anyhow = "1.0"
dirs = "6.0"
thiserror = "2.0"
tokio = { version = "1", features = ["rt-multi-thread", "time"] }
reqwest = { version = "0.13", features = ["json", "stream"] }
eventsource-stream = "0.2.3"
futures = "0.3"
bytes = "1.9"
tracing = "0.1"

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
