[package]
name = "mimir-knowledge"
version.workspace = true
authors.workspace = true
license.workspace = true
description = "Knowledge graph crate for Mimir: SQLite-based entity and fact storage"
repository.workspace = true
homepage.workspace = true
edition.workspace = true
rust-version.workspace = true

[dependencies]
mimir-core = { path = "../mimir-core" }
sqlx = { workspace = true }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
chrono = { version = "0.4", features = ["serde"] }
tokio = { version = "1", features = ["rt-multi-thread", "time", "fs", "macros", "sync"] }
thiserror = "2.0"
anyhow = "1.0"
tracing = "0.1"
async-trait = "0.1"
futures = "0.3"
static_assertions = "1.1"
uuid = { version = "1.23", features = ["v4", "serde"] }
tempfile = { version = "3", optional = true }

[features]
## Off-by-default memory benchmark harness. This keeps fixture generation and
## quality/performance reporting out of production builds.
test-benchmark = ["dep:tempfile"]

[dev-dependencies]
mimir-core = { path = "../mimir-core", features = ["mock-llm"] }
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
criterion = { version = "0.8.2", features = ["async_tokio"] }

[[bench]]
name = "kg_benchmarks"
harness = false

[[bench]]
name = "memory_benchmark"
harness = false
required-features = ["test-benchmark"]

[[bench]]
name = "pure_helpers"
harness = false

[[bench]]
name = "kg_write_benchmarks"
harness = false
