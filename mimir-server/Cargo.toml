[package]
name = "mimir-server"
version.workspace = true
authors.workspace = true
license.workspace = true
description = "HTTP server library for the Mimir daemon (Axum routes, state, middleware)"
repository.workspace = true
homepage.workspace = true
edition.workspace = true
rust-version.workspace = true

[dependencies]
mimir-core = { path = "../mimir-core" }
mimir-api-types = { path = "../mimir-api-types" }
mimir-knowledge = { path = "../mimir-knowledge" }
mimir-connectors = { path = "../mimir-connectors", default-features = false }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "net", "signal"] }
axum = { version = "0.8", features = ["macros", "tokio", "json"] }
tower-http = { version = "0.6", features = ["cors", "trace", "timeout"] }
tower = { version = "0.5", features = ["util"] }
notify = "8.2.0"
notify-debouncer-full = "0.7.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
futures = "0.3"
tracing = "0.1"
tracing-subscriber = "0.3"
anyhow = "1.0"
chrono = { version = "0.4", features = ["serde"] }
dashmap = "6.2"
tokio-stream = "0.1"
http = "1.2"
uuid = { version = "1.23", features = ["v4"] }

[features]
default = ["photos", "calendar", "gmail"]
## Forwarded to mimir-connectors: register the Photos (local-fs) factory.
photos = ["mimir-connectors/photos"]
## Forwarded to mimir-connectors: register the Calendar (CalDAV) factory.
calendar = ["mimir-connectors/calendar"]
## Forwarded to mimir-connectors: register the Email (IMAP) factory.
gmail = ["mimir-connectors/gmail"]
## Register the mock connector factory (test harness) in the daemon registry.
## Enabled by the CLI e2e suite so `mimir connector` exercises a real
## add → resume → sync → pause → remove cycle against an in-process daemon.
mock-connector = []

[dev-dependencies]
mimir-client = { path = "../mimir-client" }
mimir-core = { path = "../mimir-core", features = ["mock-llm"] }
reqwest = { version = "0.13", features = ["json"] }
tempfile = "3"
