[package]
name = "mimir-server"
version = "0.16.2"
edition = "2024"

[dependencies]
mimir-core = { path = "../mimir-core" }
mimir-api-types = { path = "../mimir-api-types" }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "net", "signal"] }
axum = { version = "0.8", features = ["macros", "tokio"] }
tower-http = { version = "0.6", features = ["cors", "trace", "timeout"] }
tower = { version = "0.5", features = ["util"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
futures = "0.3"
tracing = "0.1"
tracing-subscriber = "0.3"
anyhow = "1.0"
dashmap = "6.2"
tokio-stream = "0.1"
http = "1.2"
uuid = { version = "1.23", features = ["v4"] }

[dev-dependencies]
mimir-core = { path = "../mimir-core", features = ["mock-llm"] }
reqwest = { version = "0.13", features = ["json"] }
tempfile = "3"
