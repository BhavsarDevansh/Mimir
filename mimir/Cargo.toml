[package]
name = "mimir"
version.workspace = true
authors.workspace = true
license.workspace = true
description = "Single binary entry point for the Mimir personal intelligence daemon and CLI"
repository.workspace = true
homepage.workspace = true
edition.workspace = true
rust-version.workspace = true

[[bin]]
name = "mimir"
path = "src/main.rs"

[dependencies]
mimir-core = { path = "../mimir-core" }
mimir-server = { path = "../mimir-server" }
mimir-client = { path = "../mimir-client" }
mimir-api-types = { path = "../mimir-api-types" }
clap = { version = "4", features = ["derive"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "net"] }
dirs = "6.0"
serde = { version = "1.0", features = ["derive"] }
toml = "0.8"
rustyline = { version = "18", default-features = false, features = ["with-file-history"] }
inquire = "0.9.4"
is-terminal = "0.4"
futures = "0.3"
tracing = "0.1"
tracing-subscriber = "0.3"
anyhow = "1.0"
reqwest = { version = "0.13", features = ["json"] }
thiserror = "2.0"

[dev-dependencies]
tempfile = "3"
mimir-core = { path = "../mimir-core", features = ["mock-llm"] }
reqwest = { version = "0.13", features = ["blocking"] }
