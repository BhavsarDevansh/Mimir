[package]
name = "mimir"
version = "0.16.0"
edition = "2024"

[[bin]]
name = "mimir"
path = "src/main.rs"

[dependencies]
mimir-core = { path = "../mimir-core" }
mimir-server = { path = "../mimir-server" }
mimir-client = { path = "../mimir-client" }
mimir-api-types = { path = "../mimir-api-types" }
clap = { version = "4", features = ["derive"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "net"] }
dirs = "6.0"
serde = { version = "1.0", features = ["derive"] }
toml = "0.8"
rustyline = { version = "18", default-features = false, features = ["with-file-history"] }
is-terminal = "0.4"
futures = "0.3"
tracing = "0.1"
tracing-subscriber = "0.3"
anyhow = "1.0"
reqwest = { version = "0.13", features = ["json"] }
thiserror = "2.0"

[dev-dependencies]
tempfile = "3"
