[package]
name = "mimir"
version.workspace = true
authors.workspace = true
license.workspace = true
description = "Single binary entry point for the Mimir personal intelligence daemon and CLI"
repository.workspace = true
homepage.workspace = true
edition.workspace = true
rust-version.workspace = true

[[bin]]
name = "mimir"
path = "src/main.rs"

[dependencies]
mimir-core = { path = "../mimir-core" }
mimir-server = { path = "../mimir-server" }
mimir-client = { path = "../mimir-client" }
mimir-api-types = { path = "../mimir-api-types" }
mimir-knowledge = { path = "../mimir-knowledge" }
# A4 (issue #205): the interactive PKCE loopback login runs in the CLI
# process (the daemon never runs a transient HTTP server). The flow lives in
# `mimir-connectors::oauth::pkce` (built on the shared `OAuthHttpClient`
# adapter from #240); the `oauth` feature gates it. The daemon side of the
# flow is the token-ingest route, reached via `mimir-client`.
mimir-connectors = { path = "../mimir-connectors", features = ["oauth"] }
# `webbrowser` (1.2.4, latest stable) opens the provider's authorize URL in
# the user's default browser for the PKCE flow. Cross-platform (macOS `open`,
# Linux `xdg-open`, Windows `start`, WSL interop) and safe (spawns the
# platform opener, no `unsafe`). License MIT/Apache-2.0 (GPL-3-compatible).
webbrowser = "1.2.4"
clap = { version = "4", features = ["derive"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "net"] }
dirs = "6.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
rustyline = { version = "18", default-features = false, features = ["with-file-history"] }
inquire = "0.9.4"
is-terminal = "0.4"
futures = "0.3"
tracing = "0.1"
tracing-subscriber = "0.3"
anyhow = "1.0"
whoami = "1.6"
reqwest = { version = "0.13", features = ["json"] }
thiserror = "2.0"
chrono = "0.4"
colored = "3"
tabled = "0.21"

[dev-dependencies]
tempfile = "3"
mimir-core = { path = "../mimir-core", features = ["mock-llm"] }
mimir-server = { path = "../mimir-server", features = ["mock-connector"] }
# The in-process mock OAuth server (Phase 3 T2 / #207) for the daemon-level
# PKCE E2E test; the feature is test-only and off in production builds.
mimir-connectors = { path = "../mimir-connectors", features = ["test-mock-oauth"] }
reqwest = { version = "0.13", features = ["blocking"] }
nix = { version = "0.31", features = ["signal"] }
wiremock = "0.6.5"
