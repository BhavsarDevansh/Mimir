[package]
name = "md-reflow"
# Versioned independently: this is a standalone developer tool and is not a
# member of the Mimir workspace, so the workspace version bump does not apply.
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Reflow markdown prose to single-line paragraphs (Mimir AGENTS.md standard)"
license = "GPL-3.0"
publish = false

[dependencies]
pulldown-cmark = "0.13.4"

[workspace]
